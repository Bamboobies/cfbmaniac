name: Generate Weekly Matchups

on:
  schedule:
    - cron: '0 8 * 8-12 1' # Runs every Monday at 08:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run script to generate matchups
      run: node scripts/generate_matchups.js

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add public/matchups.json matchups.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate weekly matchups" && git push)
