<script>


const IMGBB_API_KEY = "61215c09312e6a46816a8308158d24f4";
let rankCount = 10;
let rankings = {}; // slotIndex -> playerObject
let currentEditingSlot = -1;
let currentMode = 'rankings';
const awardsList = [
  { id: "heisman", name: "Heisman Memorial Trophy", desc: "Outstanding player of the year" },
  { id: "maxwell", name: "Maxwell Award", desc: "Player of the year" },

  { id: "mackey", name: "John Mackey Award", desc: "Outstanding tight end" },
  { id: "outland", name: "Outland Trophy", desc: "Most outstanding interior lineman" },
  { id: "rimington", name: "Rimington Trophy", desc: "Best center" },
  { id: "bednarik", name: "Chuck Bednarik Award", desc: "Defensive player of the year" },
  { id: "nagurski", name: "Bronko Nagurski Trophy", desc: "Defensive player of the year" },
  { id: "butkus", name: "Dick Butkus Award", desc: "Best linebacker" },
  { id: "thorpe", name: "Jim Thorpe Award", desc: "Best defensive back" },
  { id: "groza", name: "Lou Groza Award", desc: "Outstanding place-kicker" },
  { id: "ray_guy", name: "Ray Guy Award", desc: "Best collegiate punter" },
  { id: "coach_home_depot", name: "Coach of the Year (Home Depot / Eddie Robinson)", desc: "National coach of the year" },
  { id: "broyles", name: "Frank Broyles Award", desc: "Top assistant coach" },
  { id: "burlsworth", name: "Burlsworth Trophy", desc: "Top walk-on" },
  { id: "wuerffel", name: "Wuerffel Trophy", desc: "Community service" }
];


function getPlayerName(p) {
  if (p.name) return p.name;
  if (p.first_name && p.last_name) return `${p.first_name} ${p.last_name}`;
  return "Unknown Player";
}

function init() {
  populateTeamDropdown();
  setCount(10);
  restoreFromURL();
}

function onGraphicTitleChange() {
  const val = document.getElementById("graphicTitleInput").value.trim();
  document.getElementById("capTitle").textContent = val || "Player Rankings";
}

function promptCustomCount() {
  const val = prompt("Enter number of players to rank (1-100):", "50");
  if (!val) return;
  const num = parseInt(val, 10);
  if (!isNaN(num) && num > 0 && num <= 100) {
    setCount(num);
  } else {
    alert("Please enter a valid number between 1 and 100.");
  }
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById("btnModeRankings").classList.toggle("active", mode === 'rankings');
  document.getElementById("btnModeAwards").classList.toggle("active", mode === 'awards');
  
  document.getElementById("countControls").style.display = mode === 'rankings' ? "flex" : "none";
  
  const captureArea = document.getElementById("captureArea");
  if (captureArea) {
    captureArea.style.maxWidth = mode === 'awards' ? "900px" : "600px";
  }
  
  const listWrapper = document.getElementById("listWrapper");
  if (listWrapper) {
    listWrapper.style.maxWidth = mode === 'awards' ? "900px" : "600px";
  }
  
  const rankList = document.getElementById("rankList");
  if (rankList) {
    if (mode === 'awards') {
      rankList.classList.add("awards-grid");
      rankList.style.display = "";
      rankList.style.flexDirection = "";
    } else {
      rankList.classList.remove("awards-grid");
      rankList.style.display = "flex";
      rankList.style.flexDirection = "column";
    }
  }
  
  document.getElementById("btnTop10").classList.toggle("active", mode === 'rankings' && rankCount === 10);
  document.getElementById("btnTop25").classList.toggle("active", mode === 'rankings' && rankCount === 25);
  document.getElementById("btnCustomCount").classList.toggle("active", mode === 'rankings' && rankCount !== 10 && rankCount !== 25);
  
  const cr = document.getElementById("capRanks");
  if (cr) {
    if (mode === 'rankings' && rankCount >= 25) cr.classList.add("count-25");
    else cr.classList.remove("count-25");
  }

  if (mode === 'awards') {
    document.getElementById("graphicTitleInput").value = "2026 Award Predictions";
  } else {
    document.getElementById("graphicTitleInput").value = "Top " + rankCount + " Players";
  }
  onGraphicTitleChange();

  renderRankList();
  renderGraphic();
}

function setCount(num) {
  rankCount = num;
  const newRankings = {};
  for (let i = 1; i <= num; i++) {
    if (rankings[i]) newRankings[i] = rankings[i];
  }
  rankings = newRankings;
  setMode('rankings');
}

function resetRankings() {
  rankings = {};
  renderRankList();
  renderGraphic();
}

function renderRankList() {
  const list = document.getElementById("rankList");

    if (player) {

      const tColor = player.team && teamColors[player.team] ? teamColors[player.team] : "#52525b";
      const pName = getPlayerName(player);
      btnContent = `
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
          <div style="display:flex; align-items:center; gap:10px;">

    watermark.style.borderRadius = "4px";

    watermark.style.fontFamily = "'Outfit', sans-serif";
    watermark.style.fontSize = "0.95rem";

    watermark.style.border = "1px dashed #3f3f46";

    watermark.style.fontFamily = "'Outfit', sans-serif";

    watermark.innerHTML = "Make your predictions at <strong style='color:#fbbf24; margin-left:5px;'>CFBManiac.com</strong>";

function populateTeamDropdown() {
  const sel = document.getElementById("modalTeam");
  const confs = {};
  teamsData.forEach(t => {
    if (!confs[t.conference]) confs[t.conference] = [];
    confs[t.conference].push(t.name);
  });
  
  Object.keys(confs).sort().forEach(conf => {
    const og = document.createElement("optgroup");
    og.label = conf;
    confs[conf].sort().forEach(tName => {
      const opt = document.createElement("option");
      opt.value = tName;
      opt.textContent = tName;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}

function openModal(slotIdx) {
  currentEditingSlot = slotIdx;
  document.getElementById("modalSearch").value = "";
  
  if (currentMode === 'awards') {
    document.getElementById("modalRankNum").textContent = awardsList[slotIdx-1].name;
  } else {
    document.getElementById("modalRankNum").textContent = "#" + slotIdx;
  }
  
  const existing = rankings[slotIdx];
  if (existing) {
    document.getElementById("modalTeam").value = existing.team !== "N/A" ? existing.team : "";
    document.getElementById("modalPos").value = existing.position !== "N/A" ? existing.position : "";
  } else {
    document.getElementById("modalTeam").value = "";
    document.getElementById("modalPos").value = "";
  }
  
  updateModalPlayers();
  if (existing) {
    document.getElementById("modalPlayer").value = existing.isCustom ? ("CUSTOM:" + existing.name) : existing.id;
  }
  
  document.getElementById("playerModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("playerModal").style.display = "none";
}

function updateModalPlayers() {
  const t = document.getElementById("modalTeam").value;
  const p = document.getElementById("modalPos").value;
  const s = document.getElementById("modalSearch").value.trim().toLowerCase();
  const sel = document.getElementById("modalPlayer");
  
  sel.innerHTML = '<option value="">-- Select a Player --</option>';
  
  let filtered = playersData;
  if (t) filtered = filtered.filter(player => player.team === t);
  if (p) filtered = filtered.filter(player => player.position === p);
  if (s) filtered = filtered.filter(player => getPlayerName(player).toLowerCase().includes(s));
  
  filtered.sort((a,b) => getPlayerName(a).localeCompare(getPlayerName(b))).forEach(player => {
    const opt = document.createElement("option");
    opt.value = player.id;
    opt.textContent = `${getPlayerName(player)} (${player.position}) - ${player.team}`;
    sel.appendChild(opt);
  });

  if (s) {
    const customOpt = document.createElement("option");
    customOpt.value = "CUSTOM:" + document.getElementById("modalSearch").value.trim();
    customOpt.textContent = `Use Custom: "${document.getElementById("modalSearch").value.trim()}"`;
    sel.appendChild(customOpt);
  }
}

function saveModalPlayer() {
  const pId = document.getElementById("modalPlayer").value;
  if (!pId) {
    delete rankings[currentEditingSlot];
  } else if (pId.startsWith("CUSTOM:")) {
    const name = pId.substring(7);
    const t = document.getElementById("modalTeam").value || "N/A";
    const p = document.getElementById("modalPos").value || "N/A";
    rankings[currentEditingSlot] = {
      isCustom: true,
      name: name,
      team: t,
      position: p
    };
  } else {
    const player = playersData.find(p => p.id == pId);
    if (player) {
      rankings[currentEditingSlot] = player;
    }
  }
  closeModal();
  renderRankList();
  renderGraphic();
}

function fillSampleQBs() {
  setCount(10);
  document.getElementById("graphicTitleInput").value = "Top 10 Quarterbacks";
  onGraphicTitleChange();
  
  const qbs = playersData.filter(p => p.position === "QB").slice(0, 10);
  rankings = {};
  qbs.forEach((qb, idx) => {
    rankings[idx + 1] = qb;
  });
  
  renderRankList();
  renderGraphic();
}

function downloadGraphic() {
  const area = document.getElementById("captureArea");
  html2canvas(area, {
    backgroundColor: "#111",
    scale: 2,
    useCORS: true,
    windowWidth: 1200,
    windowHeight: area.scrollHeight + 200,
    scrollY: -window.scrollY
  }).then(canvas => {
    const link = document.createElement("a");
    const title = document.getElementById("graphicTitleInput").value.trim() || "Rankings";
    link.download = `${title.replace(/\s+/g, "_")}_CFBManiac.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

async function shareList() {
  const btn = document.getElementById("btnShare");
  btn.disabled = true;
  btn.textContent = "Uploading...";
  try {
    const area = document.getElementById("captureArea");
    const canvas = await html2canvas(area, {
    backgroundColor: "#111",
    scale: 2,
    useCORS: true,
    windowWidth: 1200,
    windowHeight: area.scrollHeight + 200,
    scrollY: -window.scrollY
  });
    const targetWidth = Math.max(canvas.width, canvas.height * (1200 / 630));
    const paddedCanvas = document.createElement("canvas");
    paddedCanvas.width = targetWidth;
    paddedCanvas.height = canvas.height;
    const ctx = paddedCanvas.getContext("2d");
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, targetWidth, canvas.height);
    const offsetX = (targetWidth - canvas.width) / 2;
    ctx.drawImage(canvas, offsetX, 0);
    const blob = await new Promise(r => paddedCanvas.toBlob(r, "image/png"));
    const form = new FormData();
    form.append("image", blob);
    const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: "POST",
      body: form
    });
    const uploadData = await uploadRes.json();
    if (!uploadData.success) throw new Error("ImgBB upload failed");
    
    const imgUrl = uploadData.data.url;
    const params = new URLSearchParams();
    
    const predStr = Object.entries(rankings)
      .map(([i, r]) => `${i}:${r.id}`)
      .join(",");
    if (predStr) params.set("r", predStr);
    
    const title = document.getElementById("graphicTitleInput").value.trim();
    if (title) params.set("t", title);
    params.set("c", rankCount);
    
    params.set("img_url", imgUrl.replace("https://i.ibb.co/", "").replace(".png", ""));
    
    const shareLink = `${window.location.origin}/player-rankings.html?${params.toString()}`;
    await navigator.clipboard.writeText(shareLink);
    document.getElementById("shareSiteLink").value = shareLink;
    document.getElementById("shareModal").style.display = "flex";
    
    const toast = document.getElementById("toast");
    toast.className = "show";
    setTimeout(() => toast.className = "", 3000);
  } catch (err) {
    console.error(err);
    alert("Share failed. Please try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Share to Social";
  }
}

function restoreFromURL() {
  const params = new URLSearchParams(window.location.search);
  const r = params.get("r");
  const t = params.get("t");
  const c = params.get("c");
  
  if (t) {
    document.getElementById("graphicTitleInput").value = t;
    onGraphicTitleChange();
  }
  if (c) {
    setCount(parseInt(c, 10));
  }
  
  if (r) {
    r.split(",").forEach(part => {
      const [slotStr, pIdStr] = part.split(":");
      const slot = parseInt(slotStr, 10);
      const pId = pIdStr;
      if (!isNaN(slot) && pId) {
        // match id loosely since it might be a string or int from the backend
        const player = playersData.find(p => p.id == pId);
        if (player) {
          rankings[slot] = player;
        }
      }
    });
    renderRankList();
    renderGraphic();
  }
}

init();
</script>


<script type="module">
  import { initAuth, loadFromProfile, saveToProfile } from './src/global-auth.js';
  import { getCurrentCFBWeek } from './src/week-calculator.js';
  
  const cfbWeek = getCurrentCFBWeek();
  document.getElementById("graphicTitleInput").value = `${cfbWeek} Player Rankings`;
  document.getElementById("capTitle").textContent = `${cfbWeek} Player Rankings`;

  let isInitialLoad = true;
  initAuth(async (user) => {
    if (user && isInitialLoad) {
      isInitialLoad = false;
      const urlParams = new URLSearchParams(window.location.search);
      let loadId = urlParams.get('loadId');
      
      if (!loadId && !urlParams.has('r')) {
         const safeWeek = cfbWeek.replace(/ /g, '_');
         loadId = `player-rankings_${safeWeek}`;
      }

      if (loadId) {
        if (loadId.startsWith("awards")) {
           setMode("awards");
        } else if (loadId.startsWith("player-rankings")) {
           setMode("rankings");
        }
        const data = await loadFromProfile(loadId);
        if (data && data.rankings) {
            const docWeek = loadId.split('_').slice(1).join(' ').replace(/_/g, ' ') || cfbWeek;
            if (currentMode === 'awards') {
                document.getElementById("graphicTitleInput").value = `${docWeek} Award Predictions`;
                document.getElementById("capTitle").textContent = `${docWeek} Award Predictions`;
            } else {
                document.getElementById("graphicTitleInput").value = docWeek;
                document.getElementById("capTitle").textContent = docWeek;
            }
            Object.assign(rankings, data.rankings);
            if (currentMode === 'rankings') {
                const maxKey = Math.max(...Object.keys(data.rankings).map(Number).filter(n => !isNaN(n)));
                if (maxKey > 10) setCount(maxKey);
            }
            renderRankList();
            renderGraphic();
        }
      }
    }
  });

  document.getElementById("btnSave").addEventListener("click", () => {
        if (currentMode === "awards") {
      saveToProfile("awards", { rankings: rankings });
    } else {
      saveToProfile("player-rankings", { rankings: rankings });
    }
  });
</script>
